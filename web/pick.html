<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick zones</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; left: 8px; right: 8px; bottom: 8px; background: #fff;
           padding: 10px; border-radius: 10px; font-size: 14px; }
  #panel input { width: 45%; padding: 6px; }
  #panel button { padding: 6px 10px; }
  #out { width: 100%; height: 90px; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="picked">Tap the map to pick a spot</div>
  <input id="name" placeholder="name, e.g. Caf">
  <input id="radius" type="number" value="40"> m
  <button id="add">Add</button>
  <textarea id="out" readonly></textarea>
</div>

<script>
const map = new maplibregl.Map({
  container: 'map',
  center: [3.7200, 6.8900],   // [lng, lat], pan to your campus if this is off
  zoom: 17,
  pitch: 60,
  maxPitch: 80,
  style: {
    version: 8,
    sources: {
      sat: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: 'Imagery © Esri'
      },
      osm: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' }
    },
    layers: [
      { id: 'sat', type: 'raster', source: 'sat' },
      {
        id: 'buildings', type: 'fill-extrusion', source: 'osm', 'source-layer': 'building',
        paint: {
          'fill-extrusion-color': '#b5835a',
          'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.85
        }
      }
    ]
  }
});

map.addControl(new maplibregl.NavigationControl());

let last = null;
const lines = [];

map.on('click', (e) => {
  last = e.lngLat;
  document.getElementById('picked').textContent =
    'lat ' + last.lat.toFixed(5) + ', lng ' + last.lng.toFixed(5);
});

document.getElementById('add').onclick = () => {
  const name = document.getElementById('name').value.trim();
  const radius = document.getElementById('radius').value;
  if (!last || !name) return;
  new maplibregl.Marker().setLngLat(last).setPopup(new maplibregl.Popup().setText(name)).addTo(map);
  lines.push('Zone { name: "' + name + '", lat: ' + last.lat.toFixed(5) +
             ', lng: ' + last.lng.toFixed(5) + ', radius_m: ' + radius + '.0 },');
  document.getElementById('out').value = lines.join('\n');
  document.getElementById('name').value = '';
};
</script>
</body>
</html>
