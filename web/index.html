<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ted</title>
  </head>
  <body>
    <nav id="nav" aria-label="Main">
      <button class="tab active" data-tab="map">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>Map</span>
      </button>
      <button class="tab" data-tab="feed">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span>Feed</span>
      </button>
    </nav>

    <main>
      <section id="map-view" class="view active">
        <div id="map"></div>
        <button id="locate" aria-label="Find me">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </section>

            <section id="feed-view" class="view">
        <div id="feed-home">
          <div id="home-scroll" class="scroller">
            <div class="col frame">
              <form id="composer">
                <div id="composer-avatar"></div>
                <div class="c-box">
                  <textarea id="ask-text" rows="2" maxlength="500" placeholder="Ask about anything on campus and people can answer"></textarea>
                  <div id="poll-fields" hidden>
                    <input class="opt-in" maxlength="80" placeholder="Option 1" autocomplete="off">
                    <input class="opt-in" maxlength="80" placeholder="Option 2" autocomplete="off">
                    <button id="add-option" type="button">Add option</button>
                  </div>
                  <div class="c-tools">
                    <button id="poll-toggle" type="button" aria-label="Add a poll" aria-pressed="false">
                      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h10M4 12h16M4 18h7"/></svg>
                    </button>
                    <button id="post-btn" type="submit">Post</button>
                  </div>
                </div>
              </form>
              <div id="feed-list"></div>
            </div>
          </div>
          <div class="fabs">
            <button id="bell" class="fab" type="button" aria-label="Turn notifications on" aria-pressed="false"></button>
            <button id="theme" class="fab" type="button" aria-label="Switch light or dark"></button>
          </div>
        </div>

        <div id="thread" hidden>
          <div id="thread-scroll" class="scroller">
            <div class="col frame">
              <header class="thread-bar">
                <button id="thread-back" type="button" aria-label="Back">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <h1>Thread</h1>
              </header>
              <div id="thread-body"></div>
            </div>
          </div>
          <div class="bar bottom">
            <div class="col">
              <div id="replying-to" hidden>
                <span id="replying-text"></span>
                <button id="replying-clear" type="button" aria-label="Cancel reply">×</button>
              </div>
              <form id="reply-form">
                <input id="reply-input" maxlength="500" placeholder="Post your reply" autocomplete="off">
                <button type="submit">Send</button>
              </form>
            </div>
          </div>
        </div>

        <div id="toast" role="status" hidden></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
